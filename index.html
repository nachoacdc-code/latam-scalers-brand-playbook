<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LatAm Scalers — Brand Playbook</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --midnight:#0A1628;--aqua:#5EEAD4;--teal-600:#14B8A6;--mint-200:#A7F3D0;--teal-50:#F0FDFA;
  --slate-800:#1E293B;--slate-600:#475569;--slate-400:#94A3B8;--slate-200:#E2E8F0;--slate-100:#F1F5F9;--white:#FFFFFF;
  --success:#10B981;--warning:#F59E0B;--error:#EF4444;--info:#3B82F6;
  --sidebar-w:260px;--font:'Inter',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);color:var(--slate-600);background:var(--white);line-height:1.6;-webkit-font-smoothing:antialiased}

.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:var(--midnight);color:var(--white);padding:28px 0;overflow-y:auto;z-index:100;transition:transform .3s}
.sidebar-logo{padding:0 24px;margin-bottom:4px}
.sidebar-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:2px;color:var(--slate-400);padding:0 24px;margin-bottom:24px}
.sidebar a{display:block;font-size:13px;font-weight:500;color:var(--slate-400);text-decoration:none;padding:8px 24px;border-left:3px solid transparent;transition:all .15s}
.sidebar a:hover,.sidebar a.active{color:var(--white);background:rgba(94,234,212,.06);border-left-color:var(--aqua)}
.sidebar-sep{height:1px;background:rgba(255,255,255,.06);margin:12px 24px}

.hamburger{display:none;position:fixed;top:12px;left:12px;z-index:200;background:var(--midnight);color:var(--white);border:none;border-radius:8px;padding:8px 12px;font-size:18px;cursor:pointer}

main{margin-left:var(--sidebar-w);min-height:100vh}
.chapter{max-width:960px;margin:0 auto;padding:64px 48px 48px}
.chapter-num{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:2px;color:var(--aqua);margin-bottom:6px}
.chapter h2{font-size:clamp(28px,4vw,38px);font-weight:700;color:var(--midnight);letter-spacing:-.8px;margin-bottom:8px;line-height:1.15}
.chapter-intro{font-size:15px;color:var(--slate-400);margin-bottom:32px;max-width:640px;line-height:1.7}
.chapter-divider{border:none;border-top:2px solid var(--slate-200);margin:48px 0}

.spec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:24px}
.spec-card{background:var(--slate-100);border:1px solid var(--slate-200);border-radius:14px;overflow:hidden}
.spec-card-body{padding:20px;display:flex;align-items:center;justify-content:center;min-height:120px}
.spec-card-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--slate-400);padding:8px 16px;background:var(--white);border-top:1px solid var(--slate-200)}

.swatch-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.swatch{width:110px;text-align:center}
.swatch-block{width:110px;height:64px;border-radius:10px;border:1px solid rgba(0,0,0,.06);margin-bottom:6px}
.swatch-hex{font-size:11px;font-weight:600;color:var(--slate-600);font-family:monospace}
.swatch-name{font-size:9px;color:var(--slate-400);margin-top:1px}
.swatch-meta{font-size:8px;color:var(--slate-400);margin-top:2px;font-family:monospace;line-height:1.4}

.dont-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:20px 0}
.dont-card{background:#FEF2F2;border:1px solid #FECACA;border-radius:10px;padding:16px;text-align:center;position:relative}
.dont-card::after{content:'\2717';position:absolute;top:8px;right:10px;color:var(--error);font-size:16px;font-weight:700}
.dont-card p{font-size:10px;color:var(--error);margin-top:8px;font-weight:600}

.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.btn{display:inline-block;padding:10px 22px;border-radius:8px;font-size:13px;font-weight:600;font-family:var(--font);letter-spacing:.2px;border:2px solid transparent;cursor:pointer;text-decoration:none;transition:opacity .15s}
.btn:hover{opacity:.85}

.mockup{background:var(--white);border:1px solid var(--slate-200);border-radius:12px;overflow:hidden;margin-bottom:16px}
.mockup-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--slate-100);background:var(--slate-100)}
.mockup-dots{display:flex;gap:5px}
.mockup-dots span{width:8px;height:8px;border-radius:50%;background:var(--slate-200)}
.mockup-body{padding:20px}

.email-sig{background:var(--white);border:1px solid var(--slate-200);border-radius:10px;padding:20px;max-width:480px}
.profile-card{background:var(--white);border:1px solid var(--slate-200);border-radius:14px;padding:20px;width:280px;text-align:center}
.profile-photo{width:72px;height:72px;border-radius:50%;border:3px solid var(--aqua);background:var(--slate-200);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;color:var(--slate-400);font-size:24px;font-weight:700}
.skill-badge{display:inline-block;font-size:10px;font-weight:600;padding:3px 10px;border-radius:100px;background:var(--teal-50);color:var(--teal-600);margin:2px}

.biz-card{width:350px;height:200px;border-radius:10px;border:1px solid var(--slate-200);overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:center;padding:24px 28px}

.slide{width:100%;max-width:520px;aspect-ratio:16/9;border-radius:8px;border:1px solid var(--slate-200);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:12px}

.copy-btn{font-size:10px;padding:4px 10px;border-radius:4px;border:1px solid var(--slate-200);background:var(--white);cursor:pointer;font-family:var(--font);font-weight:600;color:var(--slate-600);transition:all .15s}
.copy-btn:hover{background:var(--slate-100)}

.tone-tag{display:inline-block;padding:6px 16px;border-radius:100px;font-size:12px;font-weight:600;margin:3px;background:var(--teal-50);color:var(--teal-600)}
.do-list{list-style:none;padding:0}
.do-list li{padding:6px 0;font-size:13px;display:flex;align-items:flex-start;gap:8px}
.do-list li::before{content:'✓';color:var(--success);font-weight:700;flex-shrink:0}
.dont-list{list-style:none;padding:0}
.dont-list li{padding:6px 0;font-size:13px;display:flex;align-items:flex-start;gap:8px}
.dont-list li::before{content:'✗';color:var(--error);font-weight:700;flex-shrink:0}

.contrast-table{width:100%;border-collapse:collapse;font-size:12px;margin:16px 0}
.contrast-table th{text-align:left;font-weight:600;padding:8px 10px;border-bottom:2px solid var(--slate-200);color:var(--midnight)}
.contrast-table td{padding:8px 10px;border-bottom:1px solid var(--slate-100)}
.pass{color:var(--success);font-weight:700}
.fail{color:var(--error);font-weight:700}

.code-block{background:var(--slate-800);color:var(--aqua);padding:16px;border-radius:8px;font-family:'Courier New',monospace;font-size:12px;overflow-x:auto;margin:12px 0;line-height:1.6;white-space:pre-wrap;position:relative}

.timeline{border-left:3px solid var(--aqua);padding-left:24px;margin:20px 0}
.timeline-item{margin-bottom:20px;position:relative}
.timeline-item::before{content:'';position:absolute;left:-30px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--aqua)}
.timeline-item h4{font-size:14px;font-weight:700;color:var(--midnight)}
.timeline-item p{font-size:12px;color:var(--slate-400);margin-top:2px}

h3{font-size:20px;font-weight:700;color:var(--midnight);margin:28px 0 12px;letter-spacing:-.3px}
h4{font-size:15px;font-weight:700;color:var(--slate-800);margin:20px 0 8px}
p.note{font-size:12px;color:var(--slate-400);line-height:1.6;margin:8px 0}

@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .hamburger{display:block}
  main{margin-left:0}
  .chapter{padding:32px 20px 40px}
  .spec-grid{grid-template-columns:1fr}
  .dont-grid{grid-template-columns:repeat(2,1fr)}
}
@media print{.sidebar,.hamburger{display:none}main{margin-left:0}.chapter{padding:20px;break-inside:avoid}}
</style>
</head>

  }

  }

  var defsDark='<defs>'+fontFace+'<linearGradient id="gradL" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#5EEAD4"/></linearGradient><linearGradient id="gradIcon" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#CBD5E1"/><stop offset="100%" stop-color="#5EEAD4"/></linearGradient></defs>';
  var iconPartLight=iconG+'<rect x="2" y="36" width="10" height="10" rx="3" fill="#0A1628"/><rect x="15" y="22" width="10" height="18" rx="3" fill="url(#gradIcon)"/><rect x="28" y="6" width="10" height="28" rx="3" fill="#5EEAD4"/></g>';
  var iconPartDark=iconG+'<rect x="2" y="36" width="10" height="10" rx="3" fill="#CBD5E1"/><rect x="15" y="22" width="10" height="18" rx="3" fill="url(#gradIcon)"/><rect x="28" y="6" width="10" height="28" rx="3" fill="#5EEAD4"/></g>';
  var textLight='<text x="48" y="33" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#0A1628">latam </text><text x="102" y="33" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700"><tspan fill="#0A1628">sca</tspan><tspan font-size="29" fill="url(#gradL)">l</tspan><tspan font-size="20" fill="#0A1628">ers</tspan></text>';
  var textDark='<text x="48" y="33" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#FFFFFF">latam </text><text x="102" y="33" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700"><tspan fill="#FFFFFF">sca</tspan><tspan font-size="29" fill="url(#gradL)">l</tspan><tspan font-size="20" fill="#FFFFFF">ers</tspan></text>';
  if(i===0)return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+vb+'" width="220" height="48">'+lockupBg+defsLight+iconPartLight+textLight+'</svg>';

function dlSVG(i){

  var names=['lockup-light','lockup-dark','icon-only-light','icon-only-dark','lockup-mono-black','lockup-mono-white'];

}
function dlLogoPNG(i){
  var data=getLogoSVGString(i,true);
  if(!data){alert('Download not available for this variant.');return;}
  var names=['lockup-light','lockup-dark','icon-only-light','icon-only-dark','lockup-mono-black','lockup-mono-white'];
  var isLockup=i===0||i===1||i===4||i===5;
  var scale=4;
  var w=isLockup?220*scale:42*scale,h=isLockup?48*scale:48*scale;
  var img=new Image();
  img.onload=function(){
    var canvas=document.createElement('canvas');
    canvas.width=w;
    canvas.height=h;
    var ctx=canvas.getContext('2d');
    ctx.clearRect(0,0,w,h);
    ctx.drawImage(img,0,0,w,h);
    var a=document.createElement('a');
    a.download='latamscalers-'+names[i]+'.png';
    a.href=canvas.toDataURL('image/png');
    a.style.display='none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){document.body.removeChild(a);},300);
  };
  img.onerror=function(){alert('PNG generation failed. Try downloading the SVG instead.');};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(data);
}
function buildFaviconLinks(){
  var container=document.getElementById('fav-links');
  container.innerHTML='<span style="font-size:11px;color:#94A3B8">Generating...</span>';
  var svgFavicon='<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 42 48" width="42" height="48"><defs><linearGradient id="g" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#CBD5E1"/><stop offset="100%" stop-color="#5EEAD4"/></linearGradient></defs><rect x="2" y="36" width="10" height="10" rx="3" fill="#CBD5E1"/><rect x="15" y="22" width="10" height="18" rx="3" fill="url(#g)"/><rect x="28" y="6" width="10" height="28" rx="3" fill="#5EEAD4"/></svg>';
  var sizes=[16,32,48,64,128,256];
  var results=new Array(sizes.length+1);
  results[sizes.length]={sz:'svg',dataUrl:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgFavicon)};
  var pending=sizes.length;
  sizes.forEach(function(sz,idx){
    var iconScale=Math.min(sz/42,sz/48);
    var iconW=42*iconScale,iconH=48*iconScale;
    var tx=(sz-iconW)/2,ty=(sz-iconH)/2;
    var defs='<defs><linearGradient id="g" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#CBD5E1"/><stop offset="100%" stop-color="#5EEAD4"/></linearGradient></defs>';
    var iconG='<g transform="translate('+tx+','+ty+') scale('+iconScale+')"><rect x="2" y="36" width="10" height="10" rx="3" fill="#CBD5E1"/><rect x="15" y="22" width="10" height="18" rx="3" fill="url(#g)"/><rect x="28" y="6" width="10" height="28" rx="3" fill="#5EEAD4"/></g>';
    var svgStr='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+sz+' '+sz+'" width="'+sz+'" height="'+sz+'"><rect width="'+sz+'" height="'+sz+'" rx="'+(sz>32?Math.round(sz*.1):4)+'" fill="#0A1628"/>'+defs+iconG+'</svg>';
    var canvas=document.createElement('canvas');canvas.width=sz;canvas.height=sz;
    var ctx=canvas.getContext('2d');
    var img=new Image();
    img.onload=function(){
      ctx.drawImage(img,0,0);
      results[idx]={sz:sz,dataUrl:canvas.toDataURL('image/png')};
      pending--;
      if(pending===0)renderFavLinks(results,container);
    };
    img.onerror=function(){
      results[idx]={sz:sz,dataUrl:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgStr)};
      pending--;
      if(pending===0)renderFavLinks(results,container);
    };
    img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svgStr)));
  });
}
function renderFavLinks(results,container){
  var html='';
  for(var i=0;i<results.length;i++){
    var r=results[i];
    if(!r)continue;
    var label=r.sz==='svg'?'favicon.svg':'favicon-'+r.sz+'.png';
    html+='<a href="'+r.dataUrl+'" download="'+label+'" class="copy-btn" style="display:inline-block;text-decoration:none;padding:6px 14px;font-size:11px">'+label+'</a>';
  }
  container.innerHTML=html;
}

function copyTokens(){

  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){alert('CSS variables copied to clipboard!');}).catch(function(){
      fallbackCopy(txt);

  }else{fallbackCopy(txt);}
}
function fallbackCopy(txt){
  var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');alert('CSS variables copied to clipboard!');}catch(e){alert('Copy failed. Here are the variables:\n\n'+txt);}
  document.body.removeChild(ta);
}
